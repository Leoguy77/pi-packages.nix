name: Build and push to Attic cache
on:
  workflow_run:
    workflows: ["Update pi-packages.nix registry"]
    types:
      - completed
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: attic-push
  cancel-in-progress: false

env:
  ATTIC_ENDPOINT: https://nix-cache.lsinfra.de
  ATTIC_CACHE: pi-packages
  ATTIC_PUBLIC_KEY: pi-packages:OF+SNU2ALJB8M+cQP/RfFOuKIOMN0w4WiV8k01pvUC4=

jobs:
  push:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix with Attic substituter
        uses: DeterminateSystems/nix-installer-action@main
        with:
          flakehub: false
          extra-conf: |
            accept-flake-config = true
            extra-substituters = ${{ env.ATTIC_ENDPOINT }}/${{ env.ATTIC_CACHE }}
            extra-trusted-public-keys = ${{ env.ATTIC_PUBLIC_KEY }}

      # No magic-nix-cache: GitHub throttles the Actions cache hard, and the
      # action then answers 418 for the rest of the run instead of stepping
      # aside, which fails every build after it. Attic is the substituter here.

      - name: Build attic CLI
        run: nix build nixpkgs#attic-client --out-link /tmp/attic

      # Cloudflare rejects request bodies over 100 MB, which kills any push whose
      # NAR is bigger than that (249 packages in the 2026-11-21 run, all with
      # `HTTP 413 Payload Too Large` and a Cloudflare body). The limit is applied
      # at the edge before traefik or atticd run, so the only fix is to not go
      # through the edge: pin the hostname to the origin for this job only.
      #
      # Nothing else changes — same hostname, same cert, so attic's own config and
      # ATTIC_ENDPOINT stay as they are. The guard below turns an origin IP change
      # into one loud failure instead of thousands of unexplained 413s.
      - name: Bypass Cloudflare for pushes
        env:
          ORIGIN: ${{ secrets.ATTIC_ORIGIN_IP }}
        run: |
          [ -n "$ORIGIN" ] || { echo "::error::ATTIC_ORIGIN_IP secret is not set"; exit 1; }
          echo "$ORIGIN nix-cache.lsinfra.de" | sudo tee -a /etc/hosts >/dev/null
          curl -sf --max-time 20 "$ATTIC_ENDPOINT/$ATTIC_CACHE/nix-cache-info" >/dev/null \
            || { echo "::error::origin $ORIGIN did not answer for $ATTIC_ENDPOINT"; exit 1; }

      - name: Login to Attic
        env:
          TOKEN: ${{ secrets.ATTIC_CI_TOKEN }}
        run: /tmp/attic/bin/attic login ci "$ATTIC_ENDPOINT" "$TOKEN" --set-default

      - name: Build and push what's missing from Attic
        env:
          TOKEN: ${{ secrets.ATTIC_CI_TOKEN }}
        run: node .github/scripts/cache-push.mjs
        timeout-minutes: 330

      - name: Upload failure worklist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-failures
          path: build-failures.json
          if-no-files-found: ignore
