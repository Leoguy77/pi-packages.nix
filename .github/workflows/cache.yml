name: Build and push to Attic cache
on:
  workflow_run:
    workflows: ["Update pi-packages.nix registry"]
    types:
      - completed
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: attic-push
  cancel-in-progress: false

env:
  ATTIC_ENDPOINT: https://nix-cache.lsinfra.de
  ATTIC_CACHE: pi-packages
  ATTIC_PUBLIC_KEY: pi-packages:OF+SNU2ALJB8M+cQP/RfFOuKIOMN0w4WiV8k01pvUC4=

jobs:
  push:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix with Attic substituter
        uses: DeterminateSystems/nix-installer-action@main
        with:
          flakehub: false
          extra-conf: |
            accept-flake-config = true
            extra-substituters = ${{ env.ATTIC_ENDPOINT }}/${{ env.ATTIC_CACHE }}
            extra-trusted-public-keys = ${{ env.ATTIC_PUBLIC_KEY }}

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build attic CLI
        run: nix build nixpkgs#attic-client --out-link /tmp/attic

      - name: Login to Attic
        env:
          TOKEN: ${{ secrets.ATTIC_CI_TOKEN }}
        run: /tmp/attic/bin/attic login ci "$ATTIC_ENDPOINT" "$TOKEN" --set-default

      - name: Build and push what's missing from Attic
        env:
          TOKEN: ${{ secrets.ATTIC_CI_TOKEN }}
        run: |
          set +e
          node -e "
            const {spawnSync}=require('child_process');
            const {readFileSync}=require('fs');
            const reg=JSON.parse(readFileSync('registry/registry.json','utf8'));
            const safe=n=>n.replace(/\./g,'_');

            // Get all Tier B/C with hashes
            const names=Object.entries(reg.packages)
              .filter(([k,v])=>(v.tier==='B'||v.tier==='C')&&v.npmDepsHash?.startsWith('sha256-'))
              .map(([k])=>k);
            console.log('Packages: '+names.length);

            // Evaluate all outPaths in one eval call (fast, no builds)
            const outPaths=names.map(k=>{
              const r=spawnSync('nix',['eval','--json','.#packages.x86_64-linux.pi-'+safe(k)+'.outPath'],{timeout:5000});
              return r.status===0 ? JSON.parse(r.stdout.toString().trim()) : null;
            });

            // Filter to packages NOT in Attic
            const toBuild=names.filter((k,i)=>{
              const p=outPaths[i];
              if(!p||!p.startsWith('/nix/store/'))return true;
              const hash=p.split('/').pop().split('-')[0];
              // Check Attic with fast HTTP HEAD
              const {spawnSync:run}=require('child_process');
              const check=run('curl',['-sfI','--max-time','2',process.env.ATTIC_ENDPOINT+'/'+process.env.ATTIC_CACHE+'/'+hash+'.narinfo']);
              return check.status!==0;
            });
            console.log('Already cached: '+(names.length-toBuild.length));
            console.log('Need building: '+toBuild.length);

            // Build in batches of 200, push as we go
            const BATCH=200;
            let pushed=0;
            for(let i=0;i<toBuild.length;i+=BATCH){
              const batch=toBuild.slice(i,i+BATCH);
              const attrs=batch.map(k=>'.#pi-'+safe(k));
              console.log('Build batch '+Math.floor(i/BATCH+1)+': '+attrs.length+' pkgs');

              spawnSync('nix',[
                'build','--no-link','--keep-going',
                '--option','sandbox','false',
                '--option','max-jobs','4',
                ...attrs
              ],{stdio:['ignore','inherit','inherit'],timeout:600000});

              for(const k of batch){
                const r=spawnSync('nix',['build','--no-link','--print-out-paths','.#pi-'+safe(k)],{timeout:3000});
                if(r.status!==0)continue;
                const p=r.stdout.toString().trim();
                if(!p.startsWith('/nix/store/'))continue;
                const push=spawnSync('/tmp/attic/bin/attic',['push',process.env.ATTIC_CACHE,p],{timeout:60000});
                if(push.status===0)pushed++;
              }
              console.log('Pushed: '+pushed);
              spawnSync('nix',['store','gc'],{stdio:'ignore'});
            }
            console.log('Done: pushed='+pushed);
          "
        timeout-minutes: 360
