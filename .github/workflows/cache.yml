name: Build and push to Attic cache
on:
  workflow_run:
    workflows: ["Update pi-packages.nix registry"]
    types:
      - completed
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: attic-push
  cancel-in-progress: false

env:
  ATTIC_ENDPOINT: https://nix-cache.lsinfra.de
  ATTIC_CACHE: pi-packages
  ATTIC_PUBLIC_KEY: pi-packages:OF+SNU2ALJB8M+cQP/RfFOuKIOMN0w4WiV8k01pvUC4=

jobs:
  push:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix with Attic substituter
        uses: DeterminateSystems/nix-installer-action@main
        with:
          flakehub: false
          extra-conf: |
            accept-flake-config = true
            substituters = https://cache.nixos.org ${{ env.ATTIC_ENDPOINT }}/${{ env.ATTIC_CACHE }}
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= ${{ env.ATTIC_PUBLIC_KEY }}

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build attic CLI and login
        env:
          TOKEN: ${{ secrets.ATTIC_CI_TOKEN }}
        run: |
          nix build nixpkgs#attic-client --out-link /tmp/attic
          /tmp/attic/bin/attic login ci "$ATTIC_ENDPOINT" "$TOKEN" --set-default

      - name: Build all packages
        run: |
          nix build .#all --no-link --keep-going \
            --option sandbox false \
            --option max-jobs 4 || true
        timeout-minutes: 60

      - name: Push closure to Attic
        run: |
          ALL_PATH=$(nix build .#all --no-link --print-out-paths 2>/dev/null)
          if [ -z "$ALL_PATH" ]; then
            echo "ALL_PATH empty - trying direct eval"
            nix eval .#packages.x86_64-linux.all.outPath 2>/dev/null
            exit 1
          fi
          echo "ALL_PATH=$ALL_PATH"
          CLOSURE_SIZE=$(nix-store -qR "$ALL_PATH" 2>/dev/null | wc -l)
          echo "Closure: $CLOSURE_SIZE paths"
          nix-store -qR "$ALL_PATH" | /tmp/attic/bin/attic push "$ATTIC_CACHE" --stdin
        timeout-minutes: 30
