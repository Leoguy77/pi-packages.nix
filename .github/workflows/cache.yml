name: Build and push to Attic cache
on:
  workflow_run:
    workflows: ["Update pi-packages.nix registry"]
    types:
      - completed
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: attic-push
  cancel-in-progress: false

env:
  ATTIC_ENDPOINT: https://nix-cache.lsinfra.de
  ATTIC_CACHE: pi-packages
  ATTIC_PUBLIC_KEY: pi-packages:OF+SNU2ALJB8M+cQP/RfFOuKIOMN0w4WiV8k01pvUC4=

jobs:
  push:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix with Attic substituter
        uses: DeterminateSystems/nix-installer-action@main
        with:
          flakehub: false
          extra-conf: |
            accept-flake-config = true
            extra-substituters = ${{ env.ATTIC_ENDPOINT }}/${{ env.ATTIC_CACHE }}
            extra-trusted-public-keys = ${{ env.ATTIC_PUBLIC_KEY }}
      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Build attic CLI
        run: nix build nixpkgs#attic-client --out-link /tmp/attic
      - name: Get list of buildable packages
        id: list
        run: |
          node -e "
            const r = require('./registry/registry.json');
            const names = Object.entries(r.packages)
              .filter(([k,v]) => (v.tier==='B'||v.tier==='C') && v.npmDepsHash?.startsWith('sha256-'))
              .map(([k]) => k);
            require('fs').writeFileSync('pkg-list.txt', names.join('\n'), 'utf8');
            console.log('Packages: ' + names.length);
          "
          echo "count=$(wc -l < pkg-list.txt)" >> "$GITHUB_OUTPUT"
      - name: Login to Attic
        env:
          TOKEN: ${{ secrets.ATTIC_CI_TOKEN }}
        run: /tmp/attic/bin/attic login ci "$ATTIC_ENDPOINT" "$TOKEN" --set-default
      - name: Build, push and GC in cycles
        run: |
          set +e
          BATCH=50
          TOTAL=$(wc -l < pkg-list.txt)
          for ((i=1; i<=TOTAL; i+=BATCH)); do
            END=$((i+BATCH-1))
            [ $END -gt $TOTAL ] && END=$TOTAL
            PACKAGES=$(sed -n "${i},${END}p" pkg-list.txt)
            echo "=== Cycle $(((i-1)/BATCH+1)): pkgs $i-$END ==="

            # Check each package: build if not already in Attic
            TO_BUILD=""
            TO_SKIP=0
            while IFS= read -r pkg; do
              safe=$(echo "$pkg" | tr '.' '_')
              path=$(nix build --no-link --print-out-paths ".#pi-$safe" 2>/dev/null)
              if [ -n "$path" ] && [ "${path#/nix/store/}" != "$path" ]; then
                hash=$(basename "$path" | cut -d- -f1)
                if curl -sfI "$ATTIC_ENDPOINT/$ATTIC_CACHE/$hash.narinfo" >/dev/null 2>&1; then
                  TO_SKIP=$((TO_SKIP+1))
                  continue
                fi
              fi
              TO_BUILD="$TO_BUILD .#pi-$safe"
            done <<< "$PACKAGES"
            echo "Skip=$TO_SKIP Build=$((END-i+1-TO_SKIP))"

            if [ -n "$TO_BUILD" ]; then
              nix build --no-link --keep-going \
                --option sandbox false \
                --option max-jobs 4 \
                $TO_BUILD || true
            fi

            # Push newly built paths
            while IFS= read -r pkg; do
              safe=$(echo "$pkg" | tr '.' '_')
              path=$(nix build --no-link --print-out-paths ".#pi-$safe" 2>/dev/null)
              if [ -n "$path" ] && [ "${path#/nix/store/}" != "$path" ]; then
                hash=$(basename "$path" | cut -d- -f1)
                if ! curl -sfI "$ATTIC_ENDPOINT/$ATTIC_CACHE/$hash.narinfo" >/dev/null 2>&1; then
                  /tmp/attic/bin/attic push "$ATTIC_CACHE" "$path" 2>/dev/null || true
                fi
              fi
            done <<< "$PACKAGES"

            nix store gc 2>/dev/null || true
            df -h / | tail -1
          done
        timeout-minutes: 360
      - name: Summary
        run: |
          echo "## Attic Cache Push" >> "$GITHUB_STEP_SUMMARY"
          echo "Total packages: ${{ steps.list.outputs.count }}" >> "$GITHUB_STEP_SUMMARY"
