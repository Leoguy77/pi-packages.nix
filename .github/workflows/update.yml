name: Update pi-packages.nix registry
permissions:
  contents: write
  pull-requests: write
  id-token: write
on:
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Check already-registered packages for new versions (default 1; 0 = new packages only)'
        required: false
        default: '1'
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix flake check

  update-registry:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # 330 min, not GitHub's 360: the run must reach the commit step before the
    # platform kills it, otherwise a long refresh discards every bump it made.
    timeout-minutes: 330
    concurrency:
      group: registry-update
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Update package metadata
        run: node registry/generate.mjs
        env:
          REGISTRY_ONLY: '1'
          CONCURRENCY: '4'
          REFRESH: ${{ github.event.inputs.refresh || '1' }}
      - name: Generate lockfiles for new Tier B packages
        run: node registry/generate.mjs
        env:
          LOCKS_ONLY: '1'
          CONCURRENCY: '4'
      - name: Clean broken lockfiles
        run: |
          node -e "
            const fs=require('fs'),p=require('path');
            const base='packages';
            fs.readdirSync(base).filter(d=>d!=='.gitkeep').forEach(d=>{
              const lp=p.join(base,d,'package-lock.json');
              if(!fs.existsSync(lp))return;
              const l=JSON.parse(fs.readFileSync(lp,'utf8'));
              const m=Object.entries(l.packages||{}).filter(([pkg,i])=>i.version&&!i.integrity&&pkg!=='');
              if(m.length>0)fs.unlinkSync(lp);
            });
          "
      - name: Compute npmDepsHash for Tier B packages missing one
        run: |
          # prefetch-npm-deps reads a lockfile and prints the fixed-output hash
          # buildNpmPackage expects. It is I/O bound (~30s/package), so run a bounded
          # number in parallel: serial, the ~11k packages this backfill created would
          # need ~92h (4 weeks of nightly runs); at 8-way it is a few nights.
          export PATH="$(nix build nixpkgs#prefetch-npm-deps --no-link --print-out-paths)/bin:$PATH"
          node -e "
            const {execSync} = require('child_process');
            const {readFileSync,writeFileSync,existsSync} = require('fs');
            const r = JSON.parse(readFileSync('registry/registry.json','utf8'));
            const pending = Object.entries(r.packages).filter(([k,v]) =>
              v.tier === 'B' && !v.npmDepsHash && existsSync('packages/'+k+'/package-lock.json')
            );
            // 8-way, so the budget is wall clock: 3h used to cap throughput, now it just
            // leaves margin for the lockfile pass and the commit inside the 330-min job cap.
            const BUDGET_MS = Number(process.env.HASH_BUDGET_MS || 4 * 60 * 60 * 1000);
            const CONCURRENCY = Number(process.env.HASH_CONCURRENCY || 8);
            const started = Date.now();
            console.log('Computing npmDepsHash for', pending.length, 'packages, ' + CONCURRENCY + '-way');
            let ok = 0, seen = 0;
            // execSync blocks, so it serialises even inside Promise.all. Use the async
            // exec to get real concurrency.
            const {exec} = require('child_process');
            const {promisify} = require('util');
            const run = promisify(exec);

            const runOne = async (name) => {
              try {
                const {stdout} = await run('prefetch-npm-deps packages/' + name + '/package-lock.json', { timeout: 300000, maxBuffer: 1048576 });
                const m = stdout.match(/sha256-\S+/);
                if (m) { r.packages[name].npmDepsHash = m[0]; ok++; }
                else console.log('  SKIP', name, '(no hash)');
              } catch(e) {
                console.log('  FAIL', name, String(e.message).slice(0,60));
              }
            };

            (async () => {
              for (let i = 0; i < pending.length; i += CONCURRENCY) {
                if (Date.now() - started > BUDGET_MS) { console.log('  budget exhausted, deferring the rest'); break; }
                const batch = pending.slice(i, i + CONCURRENCY);
                await Promise.all(batch.map(([name]) => runOne(name)));
                seen += batch.length;
                // Checkpoint every batch so a later failure still leaves progress on disk.
                writeFileSync('registry/registry.json', JSON.stringify(r, null, 2) + '\n');
                if (seen % (CONCURRENCY * 10) === 0) console.log('  ' + seen + '/' + pending.length + ' (ok=' + ok + ')');
              }
              console.log('Done:', ok, '/', pending.length, 'hashes');
              writeFileSync('registry/registry.json', JSON.stringify(r, null, 2) + '\n');
            })();
          "
      - name: Update README stats
        run: node scripts/update-readme-stats.mjs
      - name: Check for changes
        id: changes
        if: always()
        run: |
          if ! git diff --quiet -- registry/ packages/ README.md; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      - name: Push changes to main
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Two commits: the registry is what consumers resolve, the lockfiles are
          # build inputs derived from it. Keeping them separate means a bad version
          # bump can be reverted without also reverting lockfile churn.
          if ! git diff --quiet -- registry/registry.json README.md; then
            git add registry/registry.json README.md
            git commit -m 'chore(registry): sync package versions from npm'
          fi
          if ! git diff --quiet -- packages/; then
            git add packages/
            git commit -m 'chore(locks): regenerate lockfiles for bumped packages'
          fi
          git push origin HEAD:main
