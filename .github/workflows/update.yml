name: Update pi-packages.nix registry
permissions:
  contents: write
  pull-requests: write
  id-token: write
on:
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Refresh already-registered packages whose version moved upstream (default 1; 0 = new packages only)'
        required: false
        default: '1'
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Every 2 hours except 02:00, which is the daily pruning run below. The crawl is ~80s of
    # npm search and the lockfile pass ~160s, so a run is cheap; what used to make this a
    # nightly job was the prune, which now goes at 30 req/s instead of 8.5. Pruning daily is
    # enough, and two crons matching the same hour would queue two runs behind each other.
    - cron: '0 0,4,8,12,16,20 * * *'
    - cron: '0 2 * * *'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix flake check

  update-registry:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # 330 min, not GitHub's 360: the run must reach the commit step before the
    # platform kills it, otherwise a long refresh discards every bump it made.
    timeout-minutes: 330
    concurrency:
      group: registry-update
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Update package metadata
        run: node registry/generate.mjs
        env:
          REGISTRY_ONLY: '1'
          CONCURRENCY: '4'
          REFRESH_STALE: ${{ github.event.inputs.refresh || '1' }}
          # Prune only on the scheduled 02:00 run, and not on the 2-hourly ones: the crawl
          # is ~1.5 min and the prune ~6.5 min, so pruning every 2 hours would spend most
          # of the job asking npm about packages that are still there. A dead package no
          # one has published over survives until 02:00, which is fine.
          PRUNE: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 2 * * *') && '1' || '0' }}
      - name: Report pruned packages
        if: always()
        run: |
          if [ -f registry/.pruned.json ]; then
            echo "Removed $(node -p 'require("./registry/.pruned.json").length' 2>/dev/null) packages:"
            node -p 'require("./registry/.pruned.json").map(p => "  " + p.key + "@" + p.version).join("\n")' 2>/dev/null | head -50
          else
            echo "Nothing pruned."
          fi
      - name: Generate lockfiles for new packages with dependencies
        run: node registry/generate.mjs
        env:
          LOCKS_ONLY: '1'
          CONCURRENCY: '4'
      - name: Clean broken lockfiles
        run: |
          node -e "
            const fs=require('fs'),p=require('path');
            const base='packages';
            fs.readdirSync(base).filter(d=>d!=='.gitkeep').forEach(d=>{
              const lp=p.join(base,d,'package-lock.json');
              if(!fs.existsSync(lp))return;
              const l=JSON.parse(fs.readFileSync(lp,'utf8'));
              // An entry legitimately has no integrity when npm never fetched it:
              // "optional": true means it did not apply to this platform, and
              // "inBundle": true means it ships inside its parent tarball. Flagging
              // those deleted 195 perfectly good lockfiles per run, which then had to
              // be regenerated from scratch on the next one.
              const m=Object.entries(l.packages||{}).filter(([pkg,i])=>
                i.version&&!i.integrity&&pkg!==''&&!i.optional&&!i.inBundle);
              if(m.length>0)fs.unlinkSync(lp);
            });
          "
      - name: Update README stats
        run: node scripts/update-readme-stats.mjs
      - name: Update repository description
        # The About blurb quotes the package count, which this job just changed.
        # GITHUB_TOKEN cannot edit repository metadata, so this needs a PAT with
        # `repo` scope; skipped rather than failed when the secret is absent.
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "REPO_ADMIN_TOKEN not set; leaving the description alone"
            exit 0
          fi
          total=$(node -e 'console.log(Object.keys(JSON.parse(require("fs").readFileSync("registry/registry.json","utf8")).packages).length.toLocaleString("en-US"))')
          desc="Every pi.dev package on npm (${total}) as Nix derivations — no npm at build time, no binary cache needed"
          current=$(gh api repos/${{ github.repository }} --jq .description)
          [ "$current" = "$desc" ] && { echo "description up to date"; exit 0; }
          gh repo edit --description "$desc" && echo "description updated to: $desc"
      - name: Check for changes
        id: changes
        if: always()
        run: |
          if ! git diff --quiet -- registry/ packages/ README.md; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      - name: Push changes to main
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Two commits: the registry is what consumers resolve, the lockfiles are
          # build inputs derived from it. Keeping them separate means a bad version
          # bump can be reverted without also reverting lockfile churn.
          if ! git diff --quiet -- registry/registry.json README.md; then
            git add registry/registry.json README.md
            git commit -m 'chore(registry): sync package versions from npm'
          fi
          if ! git diff --quiet -- packages/; then
            git add packages/
            git commit -m 'chore(locks): regenerate lockfiles for bumped packages'
          fi
          git push origin HEAD:main
